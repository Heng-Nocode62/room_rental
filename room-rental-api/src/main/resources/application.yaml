spring:
  application:
    name: room-rental-api
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    open-in-view: false

    hibernate:
      ddl-auto: validate

    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  flyway:
    enabled: true
    locations:
      - classpath:db/migration
      - classpath:db/seeder
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:hengkiller657@gmail.com}
    password: ${MAIL_PASSWORD:ewqg qyuu rdgs rpjo}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${SERVER_PORT:8080}

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} %-5level [%X{requestId}] %logger{36} - %msg%n"

app:
  security:
    jwt:
      secret: ${JWT_SECRET:Ub5Pzw5tOidxpZukY8dCiVRjamCmWrYWQ8ti4iAHXErKJPXvJYmjXbLUsctqacJOo3pdz6KJk6bTajGwOY1dqv}
      access-token-expiration: 900000
      refresh-token-expiration: 604800000

