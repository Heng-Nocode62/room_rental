services:

  postgres:
    image: postgres:17-alpine
    container_name: room-rental-postgres

    restart: unless-stopped

    environment:
      POSTGRES_DB: room_rental
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres

    ports:
      - "5432:5432"

    volumes:
      - room_rental_postgres_data:/var/lib/postgresql/data

    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U postgres -d room_rental"
        ]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:

  room_rental_postgres_data: